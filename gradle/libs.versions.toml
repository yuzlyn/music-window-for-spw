[versions]
kotlin = "2.4.20"
spw-workshop-api = "0.1.0-dev22"
compose-multiplatform = "1.12.0"
compose-material3 = "1.9.0"
compose-material-ripple = "1.9.1"
jna = "5.18.1"

[libraries]
spw-workshop-api = { module = "com.github.Moriafly:spw-workshop-api", version.ref = "spw-workshop-api" }
compose-runtime-desktop = { module = "org.jetbrains.compose.runtime:runtime-desktop", version.ref = "compose-multiplatform" }
compose-ui-desktop = { module = "org.jetbrains.compose.ui:ui-desktop", version.ref = "compose-multiplatform" }
compose-foundation-desktop = { module = "org.jetbrains.compose.foundation:foundation-desktop", version.ref = "compose-multiplatform" }
compose-material3-desktop = { module = "org.jetbrains.compose.material3:material3-desktop", version.ref = "compose-material3" }
compose-material-ripple-desktop = { module = "org.jetbrains.compose.material:material-ripple-desktop", version.ref = "compose-material-ripple" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spw-workshop = { id = "com.xuncorp.spw.workshop", version.ref = "spw-workshop-api" }
